name: Update README index

on:
  push:
    branches: ["main"]
    paths:
      - "_os/**"
      - "_network/**"
      - "_database/**"
      - "_datastructure/**"
      - "_algorithm/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate README index
        run: python3 scripts/generate_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update README index [skip ci]"
          git push
